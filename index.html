<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Powderpuff Playbook</title>
<meta name="description" content="Our flag football playbook: animated plays, positions, routes and rules.">
<meta name="theme-color" content="#1d3b2a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@700;800&display=swap">
<link rel="stylesheet" href="css/app.css">
<script src="config.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="#/plays" class="brand"><span class="flag" aria-hidden="true"></span><span id="team-name">Powderpuff Playbook</span></a>
    <button type="button" id="me-chip" class="me-chip" aria-label="Who are you?"></button>
  </header>
  <main id="view" class="page"></main>
  <nav class="tabs" aria-label="Main">
    <a href="#/plays" data-tab="plays"><span aria-hidden="true">🏈</span>Offense</a>
    <a href="#/defense" data-tab="defense"><span aria-hidden="true">🛡️</span>Defense</a>
    <a href="#/learn" data-tab="learn"><span aria-hidden="true">📖</span>Learn</a>
    <a href="#/gameday" data-tab="gameday"><span aria-hidden="true">📣</span>Game Day</a>
    <a href="#/team" data-tab="team"><span aria-hidden="true">👥</span>Team</a>
  </nav>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="me-dialog"></dialog>
</body>
</html>
